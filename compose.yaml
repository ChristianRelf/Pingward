services:
  pingward:
    build: .
    restart: unless-stopped
    ports:
      - "${PINGWARD_BIND_ADDRESS:-0.0.0.0}:${PINGWARD_HOST_PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATA_DIR: /data
      # Set TRUST_PROXY=1 when a trusted reverse proxy terminates HTTPS.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
    volumes:
      - pingward-data:/data

volumes:
  pingward-data:
